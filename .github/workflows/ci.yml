name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py whoami.py
      - run: python -c "import bot"
      - run: bash -n deploy/update.sh
      - run: bash -n deploy/setup-vm.sh
